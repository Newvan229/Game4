<!DOCTYPE html>
<html>
<head>
	<title></title>
	<style type="text/css">
		.enemy{
			margin-top: 100px;
			text-align:center;
			height: 250px;
		}
		.player_img{
			width:200px;
			height: 300px;
			margin-left: auto;
			margin-right: auto;
			background-size: 100% 100%;
			position: relative;
			transition: 1s;

		}
		.enemy_img{
			width:200px;
			height: 300px;
			margin-left: auto;
			margin-right: auto;
			background-size: 100% 100%;
			position: relative;
			transition: 1s;

		}
		.player{
			text-align: center;
			height: 250px;
			margin-top: 150px;

		}
		.player_property{
			position: absolute;
			top:80%;


		}
		.enemy_name{
			color: white; font-family: Arial;
		}
		.player_name{
			color: white; font-family: Arial
		}
	</style>
</head>
<body style="background-image: url(images/bg.jpg); background-size: 100% ">

	<div class="enemy">
		<h1 class="enemy_name"></h1>

		<div class="enemy_img">
			<h2 class="enemy_hp player_property" style="left: 10%;"></h2>
			<h2 class="enemy_damage player_property" style="left: 82%;"></h2>
		</div>	

	</div>

	<div class="player">
		<h1 class="player_name"></h1>
		
		<div class="player_img">
			<h2 class="player_hp player_property" style="left: 10%;"></h2>
			<h2 class="player_damage player_property" style="left: 82%;"></h2>
		</div>

	</div>

	<script type="text/javascript">

		let enemy_img = document.querySelector('.enemy_img')
		let player_img = document.querySelector('.player_img')

		let enemy_hp = document.querySelector(".enemy_hp");
	    let player_hp = document.querySelector(".player_hp");

	    let enemy_damage = document.querySelector(".enemy_damage")
	    let player_damage = document.querySelector(".player_damage")
		
		let player_block = document.querySelector(".player")
		let enemy_block = document.querySelector(".enemy")

		let enemy_name = document.querySelector(".enemy_name")
		let player_name = document.querySelector(".player_name")

		let enemy = {
			name : "Enemy",
			url : "url(images/1.png)",
			hp: 100, 
			damage: random(), 
		}

		let player = {
			name : "player",
			url : "url(images/2.png)",
			hp : 100, 
			damage: random(),
		}

		
		enemy_img.style.backgroundImage = enemy.url;
		player_img.style.backgroundImage = player.url;


		enemy_hp.innerHTML = enemy.hp; 
		player_hp.innerHTML = player.hp;
	 	enemy_damage.innerHTML = enemy.damage;
	 	player_damage.innerHTML = player.damage;
	 	enemy_name.innerHTML = enemy.name
	 	player_name.innerHTML = player.name

	function  random(){
		return Math.round(Math.random() * 100)
	}

	function attaka(){
		enemy.hp = enemy.hp - player.damage
		player.hp = player.hp - enemy.damage

		enemy_hp.innerHTML = enemy.hp
		player_hp.innerHTML = player.hp

		if(enemy.hp<player.hp){
			enemy_block.style.opacity = "0"

		}

		if(player.hp<enemy.hp){
			player_block.style.opacity = "0"
		}

	}

	setTimeout(attaka,3000)


	</script>
</body>
</html>
